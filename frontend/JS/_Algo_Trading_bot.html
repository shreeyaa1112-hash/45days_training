<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h2>Algo Trading Bot Simulation</h2>
      <div id="output"></div>
    <script>
let balance = 1000;
let stockPrice = 100;
let holdings = 0; 

// Function to update stock price randomly between 80 and 120
function updatePrice() {
  return Math.floor(Math.random() * (120 - 80 + 1)) + 80;
}

// Function to decide action based on stock price
function decideAction(price) {
  if (price < 90 && balance >= price) {
    return "BUY";
  } else if (price > 110 && holdings > 0) {
    return "SELL";
  } else {
    return "HOLD";
  }
}

// Function to execute trade
function trade(action) {
  if (action === "BUY") { //checks datatypes and values {===}
    balance -= stockPrice;
    holdings += 1;
  } else if (action === "SELL") {
    balance += stockPrice;
    holdings -= 1;
  }
  
}

// Run simulation for 10 rounds
for (let round = 1; round <= 10; round++) {
  stockPrice = updatePrice();
  let action = decideAction(stockPrice);
  trade(action);
 document.getElementById("output").innerHTML +=
    `Round ${round}: Stock price = ${stockPrice} -> Action = ${action} -> Balance = ${balance}, Holdings = ${holdings}<br>`;
}

    </script>
</body>
</html>
